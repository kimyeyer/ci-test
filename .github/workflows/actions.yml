# .github/workflows/actions.yml

# 이름 짓기
name: Github Actions로 작업 병렬로 실행하기
# push: github에 push할 때마다 실행
on: push

jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: 첫 번째 작업의 1단계
              run: echo "첫 번째 작업의 첫 번째 단계입니다."
            - name: 첫 번째 작업의 2단계
              run: echo "첫 번째 작업의 두 번째 단계입니다."

    second-job:
        runs-on: ubuntu-latest
        needs: first-job
        steps:
            - name: 두 번째 작업의 1단계
              run: echo "두 번째 작업이 드디어 시작되었습니다!"

            - name: 두 번째 작업의 2단계
              run: echo "두 번째 작업이 드디어 끝났습니다!"
