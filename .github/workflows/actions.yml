# .github/workflows/actions.yml

# 이름 짓기
name: Github Actions로 테스트 자동화하기
# push: github에 push할 때마다 실행
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 불러오기
        uses: actions/checkout@v6

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성(라이브러리) 설치
        run: npm ci # npm i 대신 ci 사용하기

      - name: 테스트 실행
        run: npm test
